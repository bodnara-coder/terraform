name: 'Terraform GCP Deploy with Checkov Security'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'
  security-events: 'write'
  actions: 'read'

jobs:
  security_scan:
    name: 'Checkov IaC Scan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Checkov Security Scan
        id: checkov_run
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: results.sarif
          # soft_fail: true means the process returns exit code 0 even if it finds issues
          soft_fail: true 

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif

  terraform:
    name: 'Terraform Deploy'
    runs-on: ubuntu-latest
    #needs: [security_scan]
    # This environment name MUST match the one created in Repo Settings
    environment: production-deploy 
    
    # Logic: 
    # 1. Run if we are on the main branch.
    # 2. Run even if security_scan 'failed' (always() ensures it doesn't skip).
    if: |
      always() && 
      needs.security_scan.result != 'cancelled' && 
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/150789158686/locations/global/workloadIdentityPools/github-pool/providers/github'
          service_account: 'github-terraform-sa@plenary-net-320615.iam.gserviceaccount.com'

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars"
